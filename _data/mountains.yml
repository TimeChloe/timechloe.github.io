# Mountains: climbing, mountaineering and trekking. Shown on the "mountains" page
# as pins on the map and as rows in the logbook table. Add new entries at the top.
#
#   name:       peak, route, crag or trek (the "peak / route" column)
#   area:       region / country (the "area" column)
#   country:    country name(s) in English, e.g. France or [France, Italy]; shaded on the travel map
#   activity:   the "type" column, e.g. mountaineering, ice climbing, trad climbing, multipitch, trekking
#   elevation:  the "elevation" column, e.g. 6,189 m (left empty shows —)
#   grade:      the "grade" column, e.g. PD+, AD, WI4, 5.10a, 6a (left empty shows —)
#   date:       shown in the first column, e.g. Jan 2026
#   year:       logbook heading; use status: regular instead for places you go all the time
#   status:     visited (default), regular, or planned (hollow pin)
#   emoji:      optional
#   lat, lng:   map position; right-click a spot in Google Maps to copy its coordinates
#   insight:    optional, a few sentences shown when someone clicks the pin
#   photos:     optional, e.g. [/images/mountains/liming-1.jpg, /images/mountains/liming-2.jpg]
#   log:        optional link to a trip report in _travel/, e.g. /travel/liming/
#
# Entries with the same lat/lng share one pin on the map.

