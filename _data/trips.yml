# Trips and places, shown both on the world map and in the lists on the personal interests page.
#
#   name:      place or trip name (bold in the list, title of the map pin)
#   activity:  optional, e.g. "backpacking"
#   date:      shown in brackets, e.g. "August 2026"
#   year:      list heading; use "regularly" for places you go to all the time
#   status:    visited (default), regular, or planned (drawn as a hollow pin)
#   emoji:     optional, shown in front of the list entry
#   lat, lng:  map position; right-click a spot in Google Maps to copy its coordinates
#   insight:   optional, a few sentences shown when someone clicks the pin
#   photos:    optional list of images, e.g. [/images/travel/act-1.jpg, /images/travel/act-2.jpg]
#   log:       optional link to a longer travel log in _travel/, e.g. /travel/arctic-circle-trail/
#
# Within each year, entries are listed in the order they appear here.

