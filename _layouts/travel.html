---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-description">{{ page.date | date: "%B %Y" }}{% if page.place %} · {{ page.place }}{% endif %}</p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  {% assign section = page.section | default: "travel" %}
  <p><a href="{{ section | prepend: '/' | append: '/' | relative_url }}">&larr; back to {{ section }}</a></p>
</article>
