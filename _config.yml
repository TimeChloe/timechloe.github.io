# Site settings.
# After changing this file, restart the local preview (Ctrl+C, then `docker compose up`).

title: Yue Zhang
tagline: Ph.D. candidate at TUM          # shown after your name in the browser tab on the home page
description: >-
  Yue Zhang, Ph.D. candidate in the Cyber-Physical Systems Group at the
  Technical University of Munich, working on safe physical human-robot interaction.
url: https://timechloe.github.io
repository: TimeChloe/timechloe.github.io
baseurl: ""
lang: en
timezone: Europe/Berlin

# Shown under your photo on the home page. Leave a field empty to hide it.
author:
  name: Yue Zhang
  email: yue22.zhang@tum.de
  photo: /images/profile.jpg
  googlescholar: https://scholar.google.com/citations?user=A6MicwgAAAAJ
  github: TimeChloe
  linkedin: yue-zhang-2b706b229

# Your name as it appears in author lists; it is underlined on the publications.
scholar_name: Yue Zhang

# Put your CV at this path and the "cv" page shows it automatically.
cv_pdf: /files/cv.pdf

# Travel logs (one Markdown file per trip in _travel/), listed on the personal interests page.
collections:
  travel:
    output: true
    permalink: /travel/:path/

defaults:
  - scope:
      path: ""
      type: travel
    values:
      layout: travel

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - vendor
  - .bundle
  - .sass-cache
